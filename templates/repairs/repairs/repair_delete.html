{% extends 'shared/delete_form.html' %}

{% block delete_form %}
<div class="alert alert-danger bg-danger bg-opacity-10 border-0 rounded-3 mb-4">
    Are you sure you want to delete <strong>{{ repair }}</strong>?
</div>

<form method="post">
    {% csrf_token %}
    <div class="d-flex gap-3 justify-content-center">
        <button type="submit" class="btn btn-danger px-4">
            <i class="bi bi-trash me-2"></i>Yes, Delete
        </button>
        <a href="{% url 'repairs:repairs_detail' repair.pk %}" class="btn btn-outline-secondary px-4">
            <i class="bi bi-x-lg me-2"></i>Cancel
        </a>
    </div>
</form>
{% endblock %}
