<div class="row g-3 mb-4">
    <div class="col-md-3">
        <div class="card border-0 rounded-4 shadow-sm bg-light">
            <div class="card-body p-3 d-flex align-items-center gap-3">
                <div class="bg-warning bg-opacity-10 text-warning rounded-3 p-2">
                    <i class="bi bi-hourglass-split fs-5"></i>
                </div>
                <div>
                    <div class="small text-muted">In Progress</div>
                    <div class="fw-bold">{{ active_count }}</div>
                </div>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card border-0 rounded-4 shadow-sm bg-light">
            <div class="card-body p-3 d-flex align-items-center gap-3">
                <div class="bg-success bg-opacity-10 text-success rounded-3 p-2">
                    <i class="bi bi-check-circle fs-5"></i>
                </div>
                <div>
                    <div class="small text-muted">Completed</div>
                    <div class="fw-bold">{{ completed_count }}</div>
                </div>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card border-0 rounded-4 shadow-sm bg-light">
            <div class="card-body p-3 d-flex align-items-center gap-3">
                <div class="bg-secondary bg-opacity-10 text-secondary rounded-3 p-2">
                    <i class="bi bi-pencil-square fs-5"></i>
                </div>
                <div>
                    <div class="small text-muted">Drafted</div>
                    <div class="fw-bold">{{ drafted_count }}</div>
                </div>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card border-0 rounded-4 shadow-sm bg-light">
            <div class="card-body p-3 d-flex align-items-center gap-3">
                <div class="bg-danger bg-opacity-10 text-danger rounded-3 p-2">
                    <i class="bi bi-x-circle fs-5"></i>
                </div>
                <div>
                    <div class="small text-muted">Cancelled</div>
                    <div class="fw-bold">{{ cancelled_count }}</div>
                </div>
            </div>
        </div>
    </div>
</div>
