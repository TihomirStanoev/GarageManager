{% extends 'base.html' %}


{% block content %}
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-5 col-md-7">
                <div class="card rounded-4 shadow border-0">
                    <div class="card-body p-4 p-md-5 text-center">
                        <div class="d-flex justify-content-center mb-4">
                            <div class="stat-icon-wrap bg-primary bg-opacity-25 text-primary">
                                <i class="bi bi-box-arrow-left fs-4"></i>
                            </div>
                        </div>
                        <h4 class="fw-bold mb-1">You have been logged out</h4>
                        <p class="text-secondary mb-4">See you next time!</p>
                        <a href="{% url 'accounts:login' %}" class="btn btn-primary px-4">
                            <i class="bi bi-box-arrow-in-right me-2"></i>Log in again
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
