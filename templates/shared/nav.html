{% load garage_simple_tags %}
<nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary border-opacity-25 sticky-top">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" href="{% url 'home:index' %}">
            <span class="brand-icon d-inline-flex align-items-center justify-content-center rounded-2">
                <i class="bi bi-tools"></i>
            </span>
            {% site_name %}
        </a>
        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav ms-auto gap-1">
                <li class="nav-item">
                    <a class="nav-link rounded-2 px-3 {% if request.resolver_match.app_name == 'home' %}active{% endif %}" href="{% url 'home:index' %}">
                        <i class="bi bi-house-fill me-1"></i>Home
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link rounded-2 px-3" href="#">
                        <i class="bi bi-people me-1"></i>Clients
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link rounded-2 px-3 {% if request.resolver_match.app_name == 'cars' %}active{% endif %}" href="{% url 'cars:list' %}">
                        <i class="bi bi-car-front me-1"></i>Cars
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link rounded-2 px-3 {% if request.path == '/repairs/' %}active{% endif %}" href="{% url 'repairs:repairs_list' %}">
                        <i class="bi bi-wrench-adjustable me-1"></i>Repairs
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link rounded-2 px-3 {% if 'parts' in request.path %}active{% endif %}" href="{% url 'repairs:parts_list' %}">
                        <i class="bi bi-box-seam me-1"></i>Parts
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link rounded-2 px-3 {% if 'invoices' in request.path %}active{% endif %}" href="{% url 'repairs:invoices_list' %}">
                        <i class="bi bi-receipt me-1"></i>Invoices
                    </a>
                </li>
                {% if user.is_authenticated %}
                            <li class="nav-item">
                            <form action="{% url 'accounts:logout' %}" method="post">
                                {% csrf_token %}
                                <input type="submit" value="Logout">
                            </form>
                    <a class="nav-link rounded-2 px-3 {% if 'invoices' in request.path %}active{% endif %}" href="{% url 'repairs:invoices_list' %}">
                        <i class="bi bi-receipt me-1"></i>LOGOUT
                    </a>
                </li>
                {% endif %}
            </ul>
        </div>
    </div>
</nav>
