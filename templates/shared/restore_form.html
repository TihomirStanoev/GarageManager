{% extends 'base.html' %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-5 col-md-7">
            <div class="card rounded-4 shadow border-0">
                <div class="card-body p-4 p-md-5 text-center">
                    <div class="mb-4">
                        <div class="d-inline-flex align-items-center justify-content-center bg-success bg-opacity-10 text-success rounded-circle mb-3" style="width: 64px; height: 64px;">
                            <i class="bi bi-arrow-counterclockwise fs-3"></i>
                        </div>
                        <h4 class="fw-bold mb-1">Restore</h4>
                        <p class="text-muted mb-0">The item will be restored and made active again.</p>
                    </div>

                    <div class="alert alert-success bg-success bg-opacity-10 border-0 rounded-3 mb-4">
                        Are you sure you want to restore <strong>{% block obj %}{% endblock %}</strong>?
                    </div>

                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex gap-3 justify-content-center">
                            <button type="submit" class="btn btn-success px-4">
                                <i class="bi bi-arrow-counterclockwise me-2"></i>Yes, Restore
                            </button>
                            <a href="{% block back_url_block %}{% endblock %}" class="btn btn-outline-secondary px-4">
                                <i class="bi bi-x-lg me-2"></i>Cancel
                            </a>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
