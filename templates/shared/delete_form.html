{% extends 'base.html' %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-5 col-md-7">
            <div class="card rounded-4 shadow border-0">
                <div class="card-body p-4 p-md-5 text-center">
                    <div class="mb-4">
                        <div class="d-inline-flex align-items-center justify-content-center bg-danger bg-opacity-10 text-danger rounded-circle mb-3" style="width: 64px; height: 64px;">
                            <i class="bi bi-trash fs-3"></i>
                        </div>
                        <h4 class="fw-bold mb-1">Delete</h4>
                        <p class="text-muted mb-0">This action cannot be undone.</p>
                    </div>

                    {% block delete_form %}

                    {% endblock %}

                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
